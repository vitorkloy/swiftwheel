<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8" />
<title>VOR</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #111; color: #f4f4f5; font: 13px/1.4 "Segoe UI", sans-serif; height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,.12); }
  header strong { letter-spacing: .04em; font-size: 12px; }
  main { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 16px; position: relative; }
  footer { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 16px; border-top: 1px solid rgba(255,255,255,.12); }
  button { background: #fff; color: #111; border: 0; border-radius: 8px; padding: 8px 14px; font-weight: 600; cursor: pointer; }
  button.ghost { background: transparent; color: #f4f4f5; border: 1px solid rgba(255,255,255,.2); }
  .stage { position: relative; max-width: 100%; max-height: 100%; }
  canvas, img, video { max-width: 100%; max-height: calc(100vh - 160px); display: block; }
  canvas.draw { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
  .bar { display: flex; gap: 12px; align-items: center; padding: 0 16px 8px; }
  input[type="range"] { flex: 1; }
  .pages { display: flex; gap: 8px; overflow: auto; width: 100%; height: 100%; align-items: flex-start; padding: 8px; }
  .page { width: 120px; flex: none; background: #1b1b1b; border: 1px solid rgba(255,255,255,.12); border-radius: 8px; padding: 6px; }
  .page img { width: 100%; height: auto; }
  .page .row { display: flex; gap: 4px; margin-top: 6px; }
  .page button { padding: 4px 6px; font-size: 11px; }
  label { display: flex; gap: 8px; align-items: center; }
  footer { align-items: center; }
  .grow { flex: 1; }
  .strip { display: flex; gap: 6px; max-width: 45%; overflow: hidden; }
  .strip span { width: 34px; height: 34px; border-radius: 6px; background: #222 center/cover; border: 1px solid rgba(255,255,255,.15); flex: none; opacity: .5; }
  .strip span.on { opacity: 1; border-color: #fff; }
  .seg { display: inline-flex; border: 1px solid rgba(255,255,255,.2); border-radius: 8px; overflow: hidden; }
  .seg button { background: transparent; color: #d4d4d8; border-radius: 0; padding: 6px 10px; font-weight: 500; }
  .seg button.on { background: #fff; color: #111; }
  .bar { flex-wrap: wrap; }
  .muted { color: #a1a1aa; }
  .form { width: min(520px, 100%); display: flex; flex-direction: column; gap: 14px; }
  .form .row { justify-content: space-between; }
  .form .row > span:first-child { color: #d4d4d8; min-width: 150px; }
  .form input.txt { flex: 1; }
  .form input[type="range"] { flex: 1; }
  input.txt, input[type="color"] { background: #1b1b1b; color: #fff; border: 1px solid rgba(255,255,255,.2); border-radius: 6px; padding: 4px 6px; height: 30px; }
  body { animation: pop .22s cubic-bezier(.2,1.2,.3,1); }
  @keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
</style>
</head>
<body>
<header><strong id="title">VOR</strong><span id="hint"></span></header>
<div class="bar" id="bar" hidden></div>
<main id="main"></main>
<footer>
  <div class="strip" id="strip"></div>
  <button class="ghost" id="reset" type="button" title="Redefinir">Redefinir</button>
  <span class="grow"></span>
  <button class="ghost" id="cancel" type="button" title="Esc">Cancelar</button>
  <button class="ghost" id="all" type="button" hidden>Aplicar a Todos</button>
  <button id="ok" type="button" title="Enter">Aplicar</button>
</footer>
<script>
const $ = (id) => document.getElementById(id);
const titles = {
  cropImage: "RECORTAR", redactImage: "OCULTAR", editImage: "EDITAR", annotateImage: "ANOTAR", frameImage: "FUNDO",
  cropVideo: "RECORTAR", redactVideo: "OCULTAR", trimVideo: "APARAR", splitVideo: "DIVIDIR", changeVideoSpeed: "VELOCIDADE", videoSnapshots: "CAPTURA",
  trimAudio: "APARAR", redactAudio: "BIPAR", audioToVideo: "FORMA DE ONDA", organizePDF: "ORGANIZAR", splitPDF: "DIVIDIR",
};
let job = null;
let rect = null;
let strokes = [];
let drawing = false;
let pages = [];
let reset = null;
let applyAll = false;
const done = (spec) => window.studio.finish(Object.assign({}, spec, { all: applyAll }));
let apply = null;

function fileUrl(p) {
  return "file:///" + String(p).replace(/\\/g, "/");
}

function mediaBox(el) {
  const stage = document.createElement("div");
  stage.className = "stage";
  stage.appendChild(el);
  $("main").appendChild(stage);
  return stage;
}

function overlay(stage) {
  const c = document.createElement("canvas");
  c.className = "draw";
  stage.appendChild(c);
  const fit = () => {
    const r = stage.getBoundingClientRect();
    c.width = Math.max(1, Math.round(r.width));
    c.height = Math.max(1, Math.round(r.height));
    paint(c);
  };
  requestAnimationFrame(fit);
  return c;
}

function paint(c) {
  const ctx = c.getContext("2d");
  ctx.clearRect(0, 0, c.width, c.height);
  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 2;
  if (rect) {
    ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
    ctx.fillStyle = "rgba(0,0,0,.35)";
    ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
  }
  ctx.strokeStyle = "#fff";
  strokes.forEach((line) => {
    ctx.beginPath();
    line.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
    ctx.stroke();
  });
}

function bindDrag(c, mode) {
  const pt = (ev) => {
    const r = c.getBoundingClientRect();
    return { x: ev.clientX - r.left, y: ev.clientY - r.top };
  };
  c.addEventListener("pointerdown", (ev) => {
    drawing = true;
    const p = pt(ev);
    if (mode === "draw") strokes.push([p]);
    else rect = { x: p.x, y: p.y, w: 0, h: 0, ox: p.x, oy: p.y };
    paint(c);
  });
  window.addEventListener("pointermove", (ev) => {
    if (!drawing) return;
    const p = pt(ev);
    if (mode === "draw") strokes[strokes.length - 1].push(p);
    else rect = { x: Math.min(rect.ox, p.x), y: Math.min(rect.oy, p.y), w: Math.abs(p.x - rect.ox), h: Math.abs(p.y - rect.oy), ox: rect.ox, oy: rect.oy };
    paint(c);
  });
  window.addEventListener("pointerup", () => { drawing = false; });
}

/* Estado das ferramentas de imagem em coordenadas normalizadas (0..1): vale para qualquer tamanho de arquivo. */
let params = null;
const DEFAULTS = {
  aspect: "free", rect: null, bright: 100, contrast: 100, sat: 100,
  shape: "pen", color: "#ff3b30", width: 4, marks: [], text: "Texto",
  bg: "solid", c1: "#111111", c2: "#3b82f6", pad: 32, radius: 0,
};
const ASPECTS = { free: 0, "1:1": 1, "4:3": 4 / 3, "3:2": 3 / 2, "16:9": 16 / 9, "9:16": 9 / 16 };

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error("Não foi possível abrir a imagem."));
    img.src = fileUrl(file);
  });
}

function drawMarks(ctx, marks, w, h) {
  const k = Math.max(w, h) / 1000;
  marks.forEach((m) => {
    ctx.strokeStyle = m.color; ctx.fillStyle = m.color;
    ctx.lineWidth = m.width * k; ctx.lineCap = "round"; ctx.lineJoin = "round";
    const P = (p) => [p.x * w, p.y * h];
    if (m.shape === "pen") {
      ctx.beginPath();
      m.pts.forEach((p, i) => (i ? ctx.lineTo(...P(p)) : ctx.moveTo(...P(p))));
      ctx.stroke();
    } else if (m.shape === "rect" || m.shape === "ellipse") {
      const [x0, y0] = P(m.a); const [x1, y1] = P(m.b);
      ctx.beginPath();
      if (m.shape === "rect") ctx.rect(Math.min(x0, x1), Math.min(y0, y1), Math.abs(x1 - x0), Math.abs(y1 - y0));
      else ctx.ellipse((x0 + x1) / 2, (y0 + y1) / 2, Math.abs(x1 - x0) / 2, Math.abs(y1 - y0) / 2, 0, 0, Math.PI * 2);
      ctx.stroke();
    } else if (m.shape === "arrow") {
      const [x0, y0] = P(m.a); const [x1, y1] = P(m.b);
      const ang = Math.atan2(y1 - y0, x1 - x0); const head = 6 * m.width * k;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x1, y1);
      ctx.lineTo(x1 - head * Math.cos(ang - 0.45), y1 - head * Math.sin(ang - 0.45));
      ctx.lineTo(x1 - head * Math.cos(ang + 0.45), y1 - head * Math.sin(ang + 0.45));
      ctx.closePath(); ctx.fill();
    } else if (m.shape === "text") {
      const [x, y] = P(m.a);
      ctx.font = `600 ${Math.round(m.width * 7 * k)}px "Segoe UI", sans-serif`;
      ctx.textBaseline = "top";
      ctx.fillText(m.text, x, y);
    }
  });
}

/** Render final (resolução cheia) — o mesmo código serve para pré-visualização e para "Aplicar a Todos". */
function renderImage(tool, img, q) {
  const W = img.naturalWidth, H = img.naturalHeight;
  const out = document.createElement("canvas");
  const ctx = out.getContext("2d");
  const r = q.rect && q.rect.w > 0.005 && q.rect.h > 0.005 ? q.rect : null;
  if (tool === "cropImage") {
    const box = r || fitAspect(q.aspect, W, H);
    const x = Math.round(box.x * W), y = Math.round(box.y * H), w = Math.max(1, Math.round(box.w * W)), h = Math.max(1, Math.round(box.h * H));
    out.width = w; out.height = h;
    ctx.drawImage(img, x, y, w, h, 0, 0, w, h);
  } else if (tool === "frameImage") {
    const pad = Math.round(q.pad / 1000 * Math.max(W, H) * 2);
    out.width = W + pad * 2; out.height = H + pad * 2;
    if (q.bg === "gradient") {
      const g = ctx.createLinearGradient(0, 0, out.width, out.height);
      g.addColorStop(0, q.c1); g.addColorStop(1, q.c2); ctx.fillStyle = g;
    } else ctx.fillStyle = q.c1;
    ctx.fillRect(0, 0, out.width, out.height);
    const rad = q.radius / 100 * Math.min(W, H) / 2;
    ctx.save();
    if (rad > 0) { ctx.beginPath(); ctx.roundRect(pad, pad, W, H, rad); ctx.clip(); }
    if (pad > 0) { ctx.shadowColor = "rgba(0,0,0,.35)"; ctx.shadowBlur = pad / 2; }
    ctx.drawImage(img, pad, pad);
    ctx.restore();
  } else {
    out.width = W; out.height = H;
    if (tool === "editImage") ctx.filter = `brightness(${q.bright}%) contrast(${q.contrast}%) saturate(${q.sat}%)`;
    ctx.drawImage(img, 0, 0);
    ctx.filter = "none";
    if (tool === "redactImage" && r) {
      const x = Math.round(r.x * W), y = Math.round(r.y * H), w = Math.round(r.w * W), h = Math.round(r.h * H);
      // Pixelização forte + desfoque: irreversível, ao contrário de um blur leve.
      const cell = Math.max(8, Math.round(Math.max(w, h) / 12));
      const tiny = document.createElement("canvas");
      tiny.width = Math.max(1, Math.round(w / cell)); tiny.height = Math.max(1, Math.round(h / cell));
      tiny.getContext("2d").drawImage(img, x, y, w, h, 0, 0, tiny.width, tiny.height);
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(tiny, 0, 0, tiny.width, tiny.height, x, y, w, h);
      ctx.imageSmoothingEnabled = true;
    }
    if (tool === "editImage" || tool === "annotateImage") drawMarks(ctx, q.marks, W, H);
  }
  return out;
}

function fitAspect(aspect, W, H) {
  const a = ASPECTS[aspect];
  if (!a) return { x: 0, y: 0, w: 1, h: 1 };
  let w = W, h = W / a;
  if (h > H) { h = H; w = H * a; }
  return { x: (W - w) / 2 / W, y: (H - h) / 2 / H, w: w / W, h: h / H };
}

function seg(id, items, value) {
  return `<span class="seg" data-k="${id}">` + items.map(([v, t]) => `<button type="button" class="${v === value ? "on" : ""}" data-v="${v}">${t}</button>`).join("") + "</span>";
}

async function imageTool(tool) {
  params = Object.assign(JSON.parse(JSON.stringify(DEFAULTS)), job.state || {});
  if (!job.state) { params.rect = null; params.marks = []; }
  const img = await loadImage(job.filePath);
  const W = img.naturalWidth, H = img.naturalHeight;
  // Proxy reduzido para a pré-visualização (RAM/CPU baixos com fotos grandes).
  const scale = Math.min(1, 1400 / Math.max(W, H));
  const view = document.createElement("canvas");
  view.width = Math.round(W * scale); view.height = Math.round(H * scale);
  const proxy = document.createElement("canvas");
  proxy.width = view.width; proxy.height = view.height;
  proxy.getContext("2d").drawImage(img, 0, 0, proxy.width, proxy.height);
  const fake = { naturalWidth: proxy.width, naturalHeight: proxy.height };
  const stage = mediaBox(view);
  const c = overlay(stage);
  const bar = $("bar");
  bar.hidden = false;
  if (tool === "cropImage") bar.innerHTML = "Proporção " + seg("aspect", Object.keys(ASPECTS).map((k) => [k, k === "free" ? "Livre" : k]), params.aspect);
  if (tool === "redactImage") bar.innerHTML = '<span class="muted">Arraste sobre a área a ocultar (pixelizada de forma irreversível).</span>';
  if (tool === "editImage") bar.innerHTML = '<label>Brilho <input data-n="bright" type="range" min="40" max="160"></label><label>Contraste <input data-n="contrast" type="range" min="40" max="160"></label><label>Saturação <input data-n="sat" type="range" min="0" max="200"></label>';
  if (tool === "annotateImage" || tool === "editImage") {
    bar.innerHTML += seg("shape", [["pen", "Caneta"], ["rect", "Retângulo"], ["ellipse", "Elipse"], ["arrow", "Seta"], ["text", "Texto"]], params.shape)
      + '<input data-n="color" type="color"><label>Traço <input data-n="width" type="range" min="1" max="20"></label>'
      + '<input data-n="text" class="txt" placeholder="Texto" style="width:110px">'
      + '<button type="button" class="ghost" id="undo">Desfazer</button>';
  }
  if (tool === "frameImage") {
    bar.innerHTML = seg("bg", [["solid", "Sólido"], ["gradient", "Gradiente"]], params.bg)
      + '<input data-n="c1" type="color"><input data-n="c2" type="color"><label>Margem <input data-n="pad" type="range" min="0" max="160"></label><label>Cantos <input data-n="radius" type="range" min="0" max="40"></label>';
  }
  bar.querySelectorAll("[data-n]").forEach((el) => {
    const k = el.dataset.n;
    el.value = String(params[k]);
    el.oninput = () => { params[k] = el.type === "range" ? Number(el.value) : el.value; refresh(); };
  });
  bar.querySelectorAll(".seg").forEach((g) => g.querySelectorAll("button").forEach((b) => {
    b.onclick = () => {
      params[g.dataset.k] = b.dataset.v;
      g.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
      if (g.dataset.k === "aspect") params.rect = ASPECTS[b.dataset.v] ? fitAspect(b.dataset.v, W, H) : null;
      refresh();
    };
  }));
  const undo = document.getElementById("undo");
  if (undo) undo.onclick = () => { params.marks.pop(); refresh(); };

  function refresh() {
    const ctx = view.getContext("2d");
    ctx.clearRect(0, 0, view.width, view.height);
    if (tool === "editImage" || tool === "annotateImage" || tool === "redactImage") {
      const pre = renderImage(tool, Object.assign(proxy, fake), params);
      ctx.drawImage(pre, 0, 0);
    } else if (tool === "frameImage") {
      const pre = renderImage(tool, Object.assign(proxy, fake), params);
      const k = Math.min(view.width / pre.width, view.height / pre.height);
      ctx.fillStyle = "#111"; ctx.fillRect(0, 0, view.width, view.height);
      ctx.drawImage(pre, (view.width - pre.width * k) / 2, (view.height - pre.height * k) / 2, pre.width * k, pre.height * k);
    } else ctx.drawImage(proxy, 0, 0);
    const o = c.getContext("2d");
    o.clearRect(0, 0, c.width, c.height);
    if ((tool === "cropImage" || tool === "redactImage") && params.rect) {
      const R = params.rect;
      o.fillStyle = "rgba(0,0,0,.5)";
      if (tool === "cropImage") {
        o.fillRect(0, 0, c.width, c.height);
        o.clearRect(R.x * c.width, R.y * c.height, R.w * c.width, R.h * c.height);
      }
      o.strokeStyle = "#fff"; o.lineWidth = 1.5;
      o.strokeRect(R.x * c.width, R.y * c.height, R.w * c.width, R.h * c.height);
    }
  }
  const fit = () => { const r = stage.getBoundingClientRect(); c.width = Math.max(1, Math.round(r.width)); c.height = Math.max(1, Math.round(r.height)); refresh(); };
  requestAnimationFrame(fit);
  window.addEventListener("resize", fit);

  const pt = (ev) => {
    const r = c.getBoundingClientRect();
    return { x: Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width)), y: Math.min(1, Math.max(0, (ev.clientY - r.top) / r.height)) };
  };
  let origin = null;
  if (tool !== "frameImage") {
    c.addEventListener("pointerdown", (ev) => {
      c.setPointerCapture(ev.pointerId);
      const p = pt(ev);
      origin = p;
      if (tool === "editImage" || tool === "annotateImage") {
        const m = { shape: params.shape, color: params.color, width: params.width, a: p, b: p, pts: [p], text: params.text || "Texto" };
        params.marks.push(m);
        if (m.shape === "text") origin = null;
      }
      refresh();
    });
    c.addEventListener("pointermove", (ev) => {
      if (!origin) return;
      const p = pt(ev);
      if (tool === "cropImage" || tool === "redactImage") {
        let w = Math.abs(p.x - origin.x), h = Math.abs(p.y - origin.y);
        const a = tool === "cropImage" ? ASPECTS[params.aspect] : 0;
        if (a) { const hp = w * W / a / H; if (hp > h) w = h * H * a / W; else h = hp; }
        params.rect = { x: p.x < origin.x ? origin.x - w : origin.x, y: p.y < origin.y ? origin.y - h : origin.y, w, h };
      } else {
        const m = params.marks[params.marks.length - 1];
        m.b = p;
        if (m.shape === "pen") m.pts.push(p);
      }
      refresh();
    });
    c.addEventListener("pointerup", () => { origin = null; });
  }

  reset = () => {
    const keep = { aspect: params.aspect };
    params = Object.assign(JSON.parse(JSON.stringify(DEFAULTS)), tool === "cropImage" ? keep : {});
    bar.querySelectorAll("[data-n]").forEach((el) => { el.value = String(params[el.dataset.n]); });
    refresh();
  };
  apply = async (all) => {
    const state = JSON.parse(JSON.stringify(params));
    const png = renderImage(tool, img, params).toDataURL("image/png");
    if (!all) return window.studio.finish({ png, state });
    // "Aplicar a Todos": mesmo ajuste (normalizado) renderizado em cada arquivo restante.
    const pngs = [png];
    for (const file of job.rest || []) {
      $("hint").textContent = `Aplicando ${pngs.length + 1} de ${(job.rest || []).length + 1}…`;
      try { pngs.push(renderImage(tool, await loadImage(file), params).toDataURL("image/png")); } catch { pngs.push(null); }
    }
    window.studio.finish({ png, pngs, all: true, state });
  };
}

/** Formulário de opções (Comprimir, Metadados, Canais) na mesma janela base. */
function formTool(tool) {
  const box = document.createElement("div");
  box.className = "form";
  const values = Object.assign({}, ...(job.form || []).map((f) => ({ [f.k]: f.value })), job.state || {});
  const name = String(job.filePath).split(/[\\/]/).pop();
  const head = document.createElement("div");
  head.className = "muted";
  head.textContent = name;
  box.appendChild(head);
  const rows = [];
  (job.form || []).forEach((f) => {
    const row = document.createElement("label");
    row.className = "row";
    const cap = document.createElement("span");
    cap.textContent = f.label;
    row.appendChild(cap);
    let input;
    if (f.type === "seg") {
      input = document.createElement("span");
      input.className = "seg";
      f.options.forEach(([v, t]) => {
        const b = document.createElement("button");
        b.type = "button"; b.textContent = t;
        b.className = String(values[f.k]) === String(v) ? "on" : "";
        b.onclick = () => { values[f.k] = v; input.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b)); sync(); };
        input.appendChild(b);
      });
    } else if (f.type === "check") {
      input = document.createElement("input");
      input.type = "checkbox"; input.checked = !!values[f.k];
      input.onchange = () => { values[f.k] = input.checked; sync(); };
    } else if (f.type === "file") {
      input = document.createElement("input");
      input.type = "file"; input.accept = "image/*";
      input.onchange = () => { values[f.k] = input.files[0] && input.files[0].path || ""; };
    } else {
      input = document.createElement("input");
      input.type = f.type === "range" ? "range" : f.type === "number" ? "number" : "text";
      input.className = "txt";
      if (f.min != null) input.min = String(f.min);
      if (f.max != null) input.max = String(f.max);
      input.value = values[f.k] == null ? "" : String(values[f.k]);
      const out = document.createElement("b");
      input.oninput = () => { values[f.k] = input.value; if (f.unit) out.textContent = input.value + f.unit; };
      if (f.unit) { out.textContent = input.value + f.unit; row.appendChild(input); input = out; }
    }
    row.appendChild(input);
    box.appendChild(row);
    rows.push([f, row]);
  });
  function sync() {
    rows.forEach(([f, row]) => {
      row.hidden = !!f.when && Object.entries(f.when).some(([k, v]) => String(values[k]) !== String(v));
    });
  }
  sync();
  $("main").appendChild(box);
  $("ok").onclick = () => done({ opts: values, state: values });
}

function timeBar(kind) {
  $("bar").hidden = false;
  const extra = kind === "speed" ? '<label>Velocidade <input id="rate" type="range" min="0.5" max="2" step="0.1" value="1.5"></label>'
    : kind === "split" ? '<label>Corte <input id="at" type="range" min="0" max="10" step="0.1" value="1"></label>'
    : '<label>Início <input id="start" type="range" min="0" max="10" step="0.1" value="0"></label><label>Fim <input id="end" type="range" min="0" max="10" step="0.1" value="1"></label>';
  $("bar").innerHTML = extra;
}

function armRange(el) {
  const set = () => {
    const dur = el.duration || 1;
    ["start", "end", "at"].forEach((id) => {
      const node = document.getElementById(id);
      if (!node) return;
      node.max = String(dur);
      if (id === "end") node.value = String(dur);
      if (id === "at") node.value = String(Math.min(dur / 2, dur));
    });
  };
  el.addEventListener("loadedmetadata", set);
}

function videoTool(tool) {
  const video = document.createElement("video");
  video.src = fileUrl(job.filePath);
  video.controls = true;
  const stage = mediaBox(video);
  armRange(video);
  if (tool === "trimVideo") timeBar("trim");
  if (tool === "changeVideoSpeed") timeBar("speed");
  if (tool === "splitVideo" || tool === "videoSnapshots") timeBar("split");
  let c = null;
  if (tool === "cropVideo" || tool === "redactVideo") {
    c = overlay(stage);
    bindDrag(c, "rect");
  }
  $("ok").onclick = () => {
    const spec = {
      start: Number((document.getElementById("start") || {}).value || document.getElementById("at") && document.getElementById("at").value || 0),
      end: Number((document.getElementById("end") || {}).value || 0),
      at: Number((document.getElementById("at") || {}).value || 0),
      rate: Number((document.getElementById("rate") || {}).value || 1),
    };
    if ((tool === "cropVideo" || tool === "redactVideo") && rect && video.videoWidth) {
      const box = stage.getBoundingClientRect();
      spec.x = rect.x / box.width * video.videoWidth;
      spec.y = rect.y / box.height * video.videoHeight;
      spec.w = rect.w / box.width * video.videoWidth;
      spec.h = rect.h / box.height * video.videoHeight;
    }
    done(spec);
  };
}

function audioTool(tool) {
  const audio = document.createElement("audio");
  audio.src = fileUrl(job.filePath);
  audio.controls = true;
  $("main").appendChild(audio);
  armRange(audio);
  if (tool !== "audioToVideo") timeBar("trim");
  else $("hint").textContent = "Exporta a forma de onda";
  $("ok").onclick = () => done({
    start: Number((document.getElementById("start") || {}).value || 0),
    end: Number((document.getElementById("end") || {}).value || 0),
  });
}

function pdfTool(tool) {
  if (tool === "splitPDF") {
    $("bar").hidden = false;
    $("bar").innerHTML = `<label>Páginas <input id="range" value="1-${job.pages.length || "N"}" style="background:#1b1b1b;color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:6px 8px"></label>`;
    $("hint").textContent = `${job.pages.length} páginas · 1-3,5`;
    $("ok").onclick = () => done({ range: document.getElementById("range").value });
  }
  pages = job.pages.map((file, index) => ({ file, index: index + 1, rotate: 0, drop: false }));
  const box = document.createElement("div");
  box.className = "pages";
  const draw = () => {
    box.innerHTML = "";
    pages.filter((p) => !p.drop).forEach((page, order) => {
      const card = document.createElement("div");
      card.className = "page";
      const img = document.createElement("img");
      img.src = fileUrl(page.file);
      img.style.transform = `rotate(${page.rotate}deg)`;
      card.appendChild(img);
      const row = document.createElement("div");
      row.className = "row";
      const btn = (text, fn) => { const b = document.createElement("button"); b.type = "button"; b.textContent = text; b.onclick = fn; row.appendChild(b); };
      btn("←", () => { if (order <= 0) return; const vis = pages.filter((p) => !p.drop); const a = pages.indexOf(vis[order]); const b = pages.indexOf(vis[order - 1]); [pages[a], pages[b]] = [pages[b], pages[a]]; draw(); });
      btn("→", () => { const vis = pages.filter((p) => !p.drop); if (order >= vis.length - 1) return; const a = pages.indexOf(vis[order]); const b = pages.indexOf(vis[order + 1]); [pages[a], pages[b]] = [pages[b], pages[a]]; draw(); });
      btn("↻", () => { page.rotate = (page.rotate + 90) % 360; draw(); });
      btn("✕", () => { page.drop = true; draw(); });
      card.appendChild(row);
      box.appendChild(card);
    });
  };
  if (tool === "organizePDF") {
    $("main").appendChild(box);
    draw();
    $("ok").onclick = () => done({
      pages: pages.filter((p) => !p.drop).map((p) => ({ index: p.index, rotate: p.rotate })),
    });
  } else {
    const strip = document.createElement("div");
    strip.className = "pages";
    job.pages.forEach((file) => {
      const img = document.createElement("img");
      img.src = fileUrl(file);
      img.style.width = "88px";
      strip.appendChild(img);
    });
    $("main").appendChild(strip);
  }
}

window.studio.job().then((data) => {
  job = data;
  const tool = String(job.id || "").slice(5);
  $("title").textContent = (titles[tool] || "VOR") + (job.total > 1 ? ` · ${job.index + 1} de ${job.total}` : "");
  // Faixa de miniaturas do lote: mostra onde você está; o ajuste anterior é mantido no próximo arquivo.
  (job.files || []).slice(0, 12).forEach((f, i) => {
    const t = document.createElement("span");
    if (/\.(png|jpe?g|webp|gif|bmp)$/i.test(f)) t.style.backgroundImage = `url("${fileUrl(f)}")`;
    t.title = String(f).split(/[\\/]/).pop();
    if (i === job.index) t.className = "on";
    $("strip").appendChild(t);
  });
  $("all").hidden = !(job.rest && job.rest.length);
  if (job.form) formTool(tool);
  else if (["cropImage", "redactImage", "editImage", "annotateImage", "frameImage"].includes(tool)) imageTool(tool);
  else if (["cropVideo", "redactVideo", "trimVideo", "splitVideo", "changeVideoSpeed", "videoSnapshots"].includes(tool)) videoTool(tool);
  else if (["trimAudio", "redactAudio", "audioToVideo"].includes(tool)) audioTool(tool);
  else pdfTool(tool);
  if (apply) $("ok").onclick = () => apply(false);
  else apply = (all) => { applyAll = all; if ($("ok").onclick) $("ok").onclick(); };
  if (!reset) reset = () => location.reload();
});
</script>
</body>
