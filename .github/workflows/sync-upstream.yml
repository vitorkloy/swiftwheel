name: Avisar atualização do Rovyl

# Avisa via issue quando HenryCauan/rovyl (main) avança.
# Não faz merge, bump, commit, tag, push nem release.

on:
  schedule:
    - cron: "0 9 * * *" # 06:00 em São Paulo
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: notify-upstream-rovyl
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verificar atualizações do Rovyl
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/notify-upstream-rovyl.sh
