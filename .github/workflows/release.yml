name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

# A release multiplataforma (Windows + macOS + Linux) fica no workflow Build,
# disparado pela mesma tag. Este ficheiro existe só para compatibilidade com
# quem ainda dispara "Release" à mão; o Build é a fonte de verdade.
jobs:
  note:
    runs-on: ubuntu-latest
    steps:
      - name: A release é o job Build
        run: |
          echo "A tag ${{ github.ref_name }} dispara o workflow Build, que publica Windows, macOS e Linux."
          echo "Não é preciso um segundo job de release aqui."
