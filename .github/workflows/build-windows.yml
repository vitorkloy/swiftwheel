name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  # Build reutilizável com ref/tag específica (não dispara sozinho a partir de outro workflow).
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      release_tag:
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: swiftwheel-windows
            builder_args: --win nsis
            files: |
              build-out/SwiftWheel_*_x64-setup.exe
              build-out/SwiftWheel_*_x64-setup.exe.blockmap
              build-out/latest.yml
          - os: macos-latest
            artifact: swiftwheel-macos
            builder_args: --mac dmg zip --x64 --arm64
            files: |
              build-out/*.dmg
              build-out/*.zip
              build-out/*.blockmap
              build-out/latest-mac.yml
          - os: ubuntu-latest
            artifact: swiftwheel-linux
            builder_args: --linux AppImage deb --x64
            files: |
              build-out/*.AppImage
              build-out/*.deb
              build-out/latest-linux.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Linux build deps (uiohook-napi, X11)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev libxtst-dev libxt-dev libxinerama-dev libxrandr-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libxkbfile-dev
      - run: npm ci
      - name: Unit tests
        run: |
          npm run test:user-data-migrate
          npm run test:persistence-shape
          npm run test:win32-launch
      - name: Unix platform tests
        if: runner.os != 'Windows'
        run: npm run test:platform-unix
      - name: Build (vite + electron-builder, sem publicar, sem assinatura)
        shell: bash
        run: |
          npm run build
          node scripts/run-electron-builder.mjs ${{ matrix.builder_args }} --publish never
        env:
          ZENITH_BUILD_OUTPUT: build-out
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    if: inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: swiftwheel-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release (Windows, macOS e Linux)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          ls -la dist
          test -n "$(find dist -maxdepth 1 -type f | head -n 1)" || { echo "nenhum artefacto em dist/"; exit 1; }
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG já existe — a acrescentar artefactos."
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi
          # Título SwiftWheel vX. Corpo = notes geradas pelo GitHub (PRs/commits), sem prefixo VOR.
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "SwiftWheel $TAG" \
            --generate-notes \
            --verify-tag
